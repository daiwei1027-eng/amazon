services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - minio_data:/minio_data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0-full
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      - "127.0.0.1:5000,localhost:5000"
      - --backend-store-uri
      - "sqlite:////mlflow_data/mlflow.db"
      - --serve-artifacts
      - --artifacts-destination
      - "/mlflow_data/experiments_records"
    volumes:
      - mlflow_data:/mlflow_data

    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


volumes:
  minio_data:
  mlflow_data: