data:
  directory: data
  files:
    sales: sales_train_evaluation.csv
    calendar: calendar.csv
    prices: sell_prices.csv
  output:
    directory: processed
    filename: m5_processed_full.parquet
    exp_sub_filename: m5_exp_sub.parquet
  sampling:
    item_counts: 100
    store_ids: ["CA_1", "CA_2"]
    seed: 42
split:
  train_end: "2016-03-23"
  validation_end: "2016-04-22"
  test_end: "2016-05-22"
features:
  directory: feature
  lags: [1,7,28]
  windows: [7,14,28]
  filename: sales_feature.parquet
  warm_up: 28
  feature_columns: [
    "units_sold",
    "sell_price",
    "is_weekend",
    "lag_1",
    "lag_7",
    "lag_28",
    "rolling_mean_7",
    "rolling_std_7",
    "rolling_mean_14",
    "rolling_std_14",
    "rolling_mean_28",
    "rolling_std_28",
]
train:
  seed: 42
  logs_enable: True
  model: lstm
  lookback: 56
  horizon: 30
  train_batch_size: 32
  valid_batch_size: 8
  epochs: 100
  criterion: mae
  patience: 5
  checkpoint_directory: checkpoints
  checkpoint_interval: 10
  season_length: 7
  lstm:
    hidden_size: 64
    num_layers: 1
  optimizer:
    lr: 0.001
    weight_decay: 0.0001

services:
  minio:
    host: localhost
    ports:
      api: 9000
      console: 9001
    secure: false
    bucket: silver
    prefix: feature

  mlflow:
    host: localhost
    ports:
      tracking: 5000
