data:
  directory: data
  files:
    sales: sales_train_evaluation.csv
    calendar: calendar.csv
    prices: sell_prices.csv
  output:
    directory: processed
    filename: m5_processed_full.parquet
    exp_sub_filename: m5_exp_sub.parquet
  sampling:
    item_counts: 100
    store_ids: ["CA_1", "CA_2"]
    seed: 42
split:
  train_end: "2016-03-23"
  validation_end: "2016-04-22"
  test_end: "2016-05-22"
features:
  directory: feature
  lags: [1,7,27]
  windows: [7,14,28]
  filename: sales_feature.parquet
train:
  lookback: 56
  horizon: 30
  train_batch_size: 32
  valid_batch_size: 8
  epochs: 1
services:
  minio:
    host: localhost
    ports:
      api: 9000
      console: 9001
    secure: false
    bucket: silver
    prefix: feature

  mlflow:
    host: localhost
    ports:
      tracking: 5000

  airflow:
    host: localhost
    ports:
      web: 8083

  torchserve:
    host: localhost
    ports:
      inference: 8080
      management: 8081
      metrics: 8082

  fastapi:
    host: localhost
    ports:
      api: 8000